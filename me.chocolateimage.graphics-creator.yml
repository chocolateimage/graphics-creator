id: me.chocolateimage.graphics-creator
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: graphics-creator
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=host

modules:
  # - name: luajit
  #   buildsystem: simple
  #   build-commands:
  #     - 'make -j $FLATPAK_BUILDER_N_JOBS CFLAGS="$CFLAGS -fPIC" PREFIX=$FLATPAK_DEST amalg'
  #     - "make PREFIX=$FLATPAK_DEST install"
  #   sources:
  #     - type: archive
  #       url: https://github.com/LuaJIT/LuaJIT/archive/194d7f2d635a11193177f0ed820ae419148f0b70.zip
  #       sha256: 0ece381496caf3839df6391d6653520a6b27fb7987dea16ec8f19e9250d1a047

  - name: qt-advanced-docking-system
    buildsystem: cmake-ninja
    config-opts:
      - -DADS_VERSION=5.0.0
    sources:
      - type: archive
        url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System/archive/refs/tags/5.0.0.zip
        sha256: b251569e4bf91f1773c0c395af5eb5ae906f556f9927aa39853449d92dfda935

  - name: graphics-creator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release

    sources:
      - type: dir
        path: src
        dest: src

      - type: dir
        path: data
        dest: data

      - type: file
        path: CMakeLists.txt

      - type: file
        path: me.chocolateimage.graphics-creator.metainfo.xml

      - type: file
        path: me.chocolateimage.graphics-creator.mime.xml

      - type: file
        path: me.chocolateimage.graphics-creator.desktop
